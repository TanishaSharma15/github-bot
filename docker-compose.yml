services:
  mysql:
    image: mysql:8
    container_name: githubbot-mysql
    environment:
      MYSQL_DATABASE: githubbot
      MYSQL_USER: githubbot
      MYSQL_PASSWORD: githubbot
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
